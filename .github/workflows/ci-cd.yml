name: CI/CD

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  SERVICE_NAME: cafe-carte-api
  APP_PORT: 8030
  NETWORK_NAME: gotiger_default

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Write .env
        env:
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          umask 077
          printf 'PORT=%s\nFRONTEND_URL=%s\nYOUTUBE_API_KEY=%s\n' "$APP_PORT" "$FRONTEND_URL" "$YOUTUBE_API_KEY" > .env

      - name: Copy .env and docker-compose.yml to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: '.env,docker-compose.yml'
          target: '/home/${{ secrets.SSH_USERNAME }}/site/${{ env.SERVICE_NAME }}'
          timeout: 120s

      - name: Blue-green deploy
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            SERVICE=${{ env.SERVICE_NAME }}
            NETWORK=${{ env.NETWORK_NAME }}
            PORT=${{ env.APP_PORT }}
            DEPLOY_DIR=/home/${{ secrets.SSH_USERNAME }}/site/$SERVICE

            cd $DEPLOY_DIR

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            docker compose pull

            if docker ps --format '{{.Names}}' | grep -q "^${SERVICE}-blue$"; then
              OLD=blue
              NEW=green
            else
              OLD=green
              NEW=blue
            fi

            docker compose up -d --force-recreate ${SERVICE}-${NEW}

            READY=false
            for i in $(seq 1 15); do
              if docker exec ${SERVICE}-${NEW} sh -c "nc -z 127.0.0.1 $PORT"; then
                READY=true
                break
              fi
              sleep 5
            done

            if [ "$READY" != "true" ]; then
              echo "Health check failed, rolling back"
              docker compose stop ${SERVICE}-${NEW}
              exit 1
            fi

            docker network disconnect $NETWORK ${SERVICE}-${OLD} 2>/dev/null || true
            docker network connect --alias ${SERVICE}-active $NETWORK ${SERVICE}-${NEW}

            docker exec nginx nginx -s reload

            sleep 10
            docker compose stop ${SERVICE}-${OLD}
            docker image prune -f
